name: Add share tags and preview images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install --quiet pillow
      - name: Apply tags and build previews
        run: python .github/scripts/og_build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/demos
          git diff --cached --quiet && echo "nothing to commit" || {
            git commit -m "Add Open Graph tags and preview images to the sample pages"
            git push
          }
